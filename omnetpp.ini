# Artery dataset generator: honest CAM/CPM ground truth.

[General]
network = dataset.DatasetWorld
user-interface = Cmdenv
cmdenv-express-mode = true
cmdenv-autoflush = true

# =============================================================================
# DATASET PARAMETERS
# =============================================================================

# output: data/groundtruth/<config>-run<n>/
*.sink.outputDir = "data/groundtruth/${configname}-run${runnumber}"
# warm-up: nothing is recorded before startTime; dataset time 0 = startTime
*.sink.startTime = 0s
*.sink.snapshotFiles = "omnetpp.ini config/sensors.xml config/lust-region.xml"
*.node[*].middleware.StationRecorder.poseInterval = 0.1s

# services; CpService penetration rate in <penetration rate=...>
*.node[*].middleware.services = xml("<services> \
    <service type='artery.application.CaService' name='CA'><listener port='2001'/></service> \
    <service type='artery.envmod.service.CpService' name='CP'><listener port='2009'/> \
        <filters><penetration rate='1.0'/></filters> \
    </service> \
    <service type='dataset.StationRecorder' name='StationRecorder'/> \
</services>")

# CAM generation: EN 302 637-2 triggering (Artery defaults)
*.node[*].middleware.CA.minInterval = 0.1s
*.node[*].middleware.CA.maxInterval = 1.0s
*.node[*].middleware.CA.withDccRestriction = true

# CPM generation and inclusion: TS 103 324 V2.1.1
*.node[*].middleware.CP.minInterval = 0.1s
*.node[*].middleware.CP.maxInterval = 1.0s
*.node[*].middleware.CP.addSensorInformation = 1.0s
*.node[*].middleware.CP.objectInclusionConfig = 1
*.node[*].middleware.CP.unusedObjectIdRetentionPeriod = 60s
*.node[*].middleware.CP.withDccRestriction = true

# radio: 20 mW, -89 dBm as in F2MD's LuST configuration (VeReMi Extension)
*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].radio.transmitter.power = 20 mW
*.node[*].wlan[*].radio.receiver.sensitivity = -89 dBm

# radars (config/sensors.xml): ETSI TR 103 562 V2.1.1 Table 4, configuration 1
*.node[*].environmentModel.sensors = xmldoc("config/sensors.xml")
*.node[*].environmentModel.FrontShortRangeRadar.fovRange = 65m
*.node[*].environmentModel.FrontShortRangeRadar.fovAngle = 80
*.node[*].environmentModel.FrontShortRangeRadar.numSegments = 4
*.node[*].environmentModel.FrontLongRangeRadar.fovRange = 150m
*.node[*].environmentModel.FrontLongRangeRadar.fovAngle = 10
*.node[*].environmentModel.RearShortRangeRadar.fovRange = 65m
*.node[*].environmentModel.RearShortRangeRadar.fovAngle = 80
*.node[*].environmentModel.RearShortRangeRadar.numSegments = 4
*.node[*].environmentModel.RearLongRangeRadar.fovRange = 150m
*.node[*].environmentModel.RearLongRangeRadar.fovAngle = 10

# =============================================================================
# FIXED
# =============================================================================

num-rngs = 3
*.node[*].middleware.rng-0 = 1
*.traci.nodes.rng-0 = 2

**.identityRegistryModule = "idRegistry"
*.environmentModel.traciModule = "traci"
*.environmentModel.nodeMobilityModule = ".mobility"
*.environmentModel.obstacleTypes = "building shop"
*.environmentModel.drawObstacles = false
*.environmentModel.drawVehicles = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.mapper.vehicleType = "artery.envmod.Car"

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2026-01-01 07:00:00"

# SUMO logs
result-dir = data/sumo
**.vector-recording = false
**.scalar-recording = false
**.statistic-recording = false


[Config lust]
description = "LuST region of interest, 07:00-09:00"
# 07:00-09:00 peak as VeReMi Extension (Table I); SUMO begins 06:30, first 30 min are warm-up
sim-time-limit = 9000s
*.sink.startTime = 1800s
*.node[*].middleware.datetime = "2026-01-01 06:30:00"
*.traci.launcher.sumocfg = "artery/scenarios/LuSTScenario/scenario/dua.actuated.sumocfg"
# LuST outputs redirected out of the submodule
*.traci.launcher.command = "%SUMO% --remote-port %PORT% --seed %SEED% --configuration-file %SUMOCFG% --begin 23400 --step-length 0.1 --default.action-step-length 1 --quit-on-end --no-step-log --no-warnings --verbose false --log %RESULTDIR%/lust-%RUN%.log --summary-output %RESULTDIR%/lust-summary-%RUN%.xml --tripinfo-output %RESULTDIR%/lust-tripinfo-%RUN%.xml"
*.traci.core.startTime = 0s
*.traci.nodes.typename = "ExtensibleNodeManager"
*.traci.nodes.numVehiclePolicies = 2
*.traci.nodes.vehiclePolicy[0].typename = "RegionOfInterestVehiclePolicy"
*.traci.nodes.vehiclePolicy[0].regionsOfInterest = xmldoc("config/lust-region.xml")
*.traci.nodes.vehiclePolicy[1].typename = "InsertionDelayVehiclePolicy"

# propagation: GEMV2 (Boban et al., IEEE TVR 2014) as in artery/scenarios/gemv2
*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"
*.radioMedium.pathLossType = "Gemv2"
*.radioMedium.pathLoss.withSmallScaleVariations = false
*.radioMedium.pathLoss.withVisualization = false
*.node[*].withAntennaMobility = true
*.node[*].antennaMobility.offsetX = -2.0 m
*.node[*].antennaMobility.offsetZ = truncnormal(2.0m, 0.4 m)
*.node[*].mobility.antennaHeight = 0.0m
